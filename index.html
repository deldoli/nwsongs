<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신세계 찬양 목록</title>

<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1RI6AdLE-pW4_5kyzVlvw-wK0eDJ5Ib-k">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1RI6AdLE-pW4_5kyzVlvw-wK0eDJ5Ib-k">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="신세계 찬양">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  @media (prefers-color-scheme: dark) { html, body { background: #161615; } }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="app" title="신세계 찬양 목록" allow="autoplay; fullscreen; screen-wake-lock; clipboard-write; web-share" allowfullscreen></iframe>
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwBaWPWFJhgfuhnI9MnLWIqCPla_ofI_0QLUU3FsOZQ9aPKUThh9ds6FAdejR_Ykw/exec';
  // v1.0.3
  // 즐겨찾기 공유 링크(?fav=…)로 열렸으면 그 정보를 앱에 그대로 넘기고,
  // 이 페이지 주소(embed)도 알려 준다. 앱은 공유 링크를 이 주소로 만들어, 받은 즐겨찾기가 이 페이지의 저장소에 들어간다.
  var here = location.origin + location.pathname;
  document.getElementById('app').src = APP_URL + (location.search ? location.search + '&' : '?') + 'embed=' + encodeURIComponent(here);
</script>
</body>
</html>
